services:
  secil-store:
    build: .
    container_name: secil-store
    ports:
      - '3000:3000'
    env_file:
      - .env.local

  nginx:
    image: nginx:alpine
    container_name: secil-store-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - secil-store
